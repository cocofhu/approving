<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClarifyChat busy 状态 · 修复前后对比 Demo</title>
<style>
:root{color-scheme:dark;--c-base:10 10 11;--c-surface:20 20 23;--c-elevated:28 28 33;--c-line:38 38 43;--c-txt:237 237 240;--c-txt2:161 161 170;--c-txt3:110 110 120;--c-accent:#7B61FF;--c-accent-2:129 140 248;--c-accent-dim:31 31 54;--c-ok:52 211 153;--c-err:220 38 38;--c-clarify:#22D3EE;--grad-logo:linear-gradient(90deg,#7B61FF 0%,#818CF8 35%,#6366F1 55%,#7B61FF 75%,#A78BFA 100%);--grad-logo-size:200% 100%;--font:Inter,ui-sans-serif,system-ui,"PingFang SC","Noto Sans SC",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}*,*::before,*::after{border-radius:0!important}
html,body{margin:0;height:100%;background:rgb(var(--c-base));color:rgb(var(--c-txt));font-family:var(--font);font-size:14px;line-height:1.5}
.page{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
.gate-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:12px;color:rgb(var(--c-txt3))}
.gate-bar strong{color:rgb(var(--c-txt));font-size:14px;font-weight:600}
.pill{display:inline-flex;padding:2px 8px;border:1px solid rgb(var(--c-line));background:rgb(var(--c-elevated));color:rgb(var(--c-txt2));font-size:11px}
.pill.bug{color:rgb(var(--c-err));border-color:rgba(220,38,38,.35);background:rgba(220,38,38,.08)}
.pill.c{color:var(--c-clarify);border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.08)}
.shell{display:grid;grid-template-columns:1fr 280px;border:1px solid rgb(var(--c-line));background:rgb(var(--c-surface));min-height:520px}
@media(max-width:860px){.shell{grid-template-columns:1fr}}
.chat-col{display:flex;flex-direction:column;min-height:520px;border-right:1px solid rgb(var(--c-line));background:rgb(var(--c-base))}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid rgb(var(--c-line));background:rgb(var(--c-surface))}
.seg{display:inline-flex;border:1px solid rgb(var(--c-line));background:rgb(var(--c-base))}
.seg button{border:0;background:transparent;color:rgb(var(--c-txt3));font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;font-family:inherit}
.seg button.active{background:rgb(var(--c-accent-dim));color:rgb(var(--c-txt))}
.seg button.bad.active{color:#fca5a5}.seg button.good.active{color:var(--c-clarify)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stages button{border:1px solid rgb(var(--c-line));background:rgb(var(--c-elevated));color:rgb(var(--c-txt3));font-size:11px;padding:5px 10px;cursor:pointer;font-family:inherit}
.stages button.active{border-color:var(--c-accent);color:rgb(var(--c-txt));background:rgb(var(--c-accent-dim))}
.play{border:0;background:var(--c-accent);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit}
.scroller{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}.row.human{flex-direction:row-reverse}
.avatar{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:600}
.avatar.agent{background:rgba(34,211,238,.15);color:var(--c-clarify)}.avatar.me{background:rgb(var(--c-accent-dim));color:rgb(var(--c-accent-2))}
.col{min-width:0;max-width:80%}
.bubble{border:1px solid rgb(var(--c-line));background:rgb(var(--c-elevated));padding:8px 12px;font-size:13px;line-height:1.625}
.bubble.human{border-color:rgba(123,97,255,.3);background:rgba(31,31,54,.6)}
.bubble.empty-air{min-height:44px;position:relative;border-color:rgba(220,38,38,.35);background:repeating-linear-gradient(-45deg,rgb(var(--c-elevated)),rgb(var(--c-elevated)) 6px,rgba(220,38,38,.06) 6px,rgba(220,38,38,.06) 12px)}
.bubble.empty-air::after{content:"空气泡（仅头像+时间，内容区空白）";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#fca5a5;background:rgba(10,10,11,.55)}
.bubble.gen{color:rgb(var(--c-txt3));display:inline-flex;align-items:center;gap:10px}
.typing-dots{display:inline-flex;align-items:center;gap:3px;height:14px}
.typing-dots i{display:block;width:5px;height:5px;background:var(--c-clarify);animation:typing-bounce 1.2s infinite ease-in-out both}
.typing-dots i:nth-child(2){animation-delay:.16s}.typing-dots i:nth-child(3){animation-delay:.32s}
.thought{border:1px solid rgb(var(--c-line));background:rgba(10,10,11,.6);color:rgb(var(--c-txt3));font-size:11.5px;margin-bottom:8px;width:100%}
.thought summary{cursor:pointer;list-style:none;padding:6px 10px;user-select:none;display:flex;align-items:center;gap:6px}
.thought summary::-webkit-details-marker{display:none}
.thought .body{padding:0 10px 8px;white-space:pre-wrap;font-family:var(--mono);line-height:1.5;border-top:1px dashed rgb(var(--c-line));padding-top:6px;margin:0}
.status-label{display:inline-flex;font-size:12px;color:rgb(var(--c-txt3));margin-bottom:6px}
.status-label.streaming{color:rgb(var(--c-accent-2));background:var(--grad-logo);background-size:var(--grad-logo-size);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3.5s ease-in-out infinite}
.time{margin-top:4px;font-size:10px;color:rgb(var(--c-txt3))}
.side{display:flex;flex-direction:column;background:rgb(var(--c-surface))}
.side-hd{padding:12px;border-bottom:1px solid rgb(var(--c-line))}
.side-hd h3{margin:0 0 4px;font-size:13px}.side-hd p{margin:0;font-size:12px;color:rgb(var(--c-txt3))}
.side-body{padding:12px;flex:1}
.check{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.check li{display:grid;grid-template-columns:14px 1fr;gap:8px;font-size:12px;padding:8px;border:1px solid rgb(var(--c-line));background:rgb(var(--c-base));color:rgb(var(--c-txt2))}
.check .dot{width:10px;height:10px;margin-top:3px;border:1.5px solid rgb(54 54 62)}
.check li.pass .dot{background:rgb(var(--c-ok));border-color:rgb(var(--c-ok))}
.check li.fail .dot{background:rgb(var(--c-err));border-color:rgb(var(--c-err))}
.note{margin-top:16px;border:1px solid rgb(var(--c-line));background:rgb(var(--c-surface));padding:14px 16px;font-size:12px;color:rgb(var(--c-txt3))}
@keyframes typing-bounce{0%,70%,100%{transform:translateY(0);opacity:.35}35%{transform:translateY(-4px);opacity:1}}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
</style>
</head>
<body>
<div class="page">
  <div class="gate-bar">
    <strong>复审/澄清对话面 busy 状态提示（C 档）</strong>
    <span class="pill bug">BUG</span>
    <span class="pill c">档位 C · Demo 真源</span>
    <span class="pill">fix/clarify-busy-status-placeholder</span>
  </div>
  <div class="shell">
    <div class="chat-col">
      <div class="toolbar">
        <div class="seg" role="tablist">
          <button type="button" class="bad active" id="btnBefore">修复前</button>
          <button type="button" class="good" id="btnAfter">修复后</button>
        </div>
        <div class="seg" id="pathSeg">
          <button type="button" class="active" data-path="clarify">澄清</button>
          <button type="button" data-path="review">复审</button>
          <button type="button" data-path="gate">旁路</button>
        </div>
        <div class="stages">
          <button type="button" class="active" data-stage="0">等待</button>
          <button type="button" data-stage="1">思考</button>
          <button type="button" data-stage="2">输出</button>
          <button type="button" class="play" id="playBtn">▶ 播放</button>
        </div>
      </div>
      <div class="scroller">
        <div class="row human">
          <div class="avatar me">我</div>
          <div class="col"><div class="bubble human">请复审本轮澄清结论。</div><div class="time">刚刚</div></div>
        </div>
        <div class="row">
          <div class="avatar agent">A</div>
          <div class="col" id="agentCol"></div>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="side-hd"><h3 id="sideTitle">修复前 · 空气泡</h3><p id="sideDesc">busy 后仅头像+时间。</p></div>
      <div class="side-body"><ul class="check" id="checklist"></ul></div>
    </aside>
  </div>
  <div class="note">
    PR 对比 Demo：修复前空气泡 vs 修复后「思考中…」占位 → 可折叠思考流（默认展开）→ 「输出中」shimmer + 正文流。
    静态路径：<code>/demos/clarify-busy-status.html</code> · 三路径同级 · 不展示工具芯片。
  </div>
</div>
<script>
(function(){
  var mode="before",stage=0,path="clarify",playTimer=null,typeTimer=null;
  var thoughtText="先核对边界：空气泡、thought 分轨、旁路对齐。";
  var fullMessage="已核对：busy 后须立刻有可见占位；thinking 与 message 分轨保留；三路径对齐后可过门禁。";
  function $(id){return document.getElementById(id)}
  function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null}if(typeTimer){clearInterval(typeTimer);typeTimer=null}$("playBtn").disabled=false;$("playBtn").textContent="▶ 播放"}
  function dots(){return '<span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>'}
  function thought(){return '<details class="thought" open><summary>✦ 思考过程</summary><div class="body">'+thoughtText+'</div></details>'}
  function checklist(){
    var items=mode==="before"
      ?[{pass:false,t:"等待首字有占位"},{pass:false,t:"思考流可折叠可见"},{pass:false,t:"正文流式 +「输出中」"},{pass:false,t:"本入口无空气泡"}]
      :[{pass:true,t:"等待首字有占位"},{pass:stage>=1,t:"思考流可折叠可见"},{pass:stage>=2,t:"正文流式 +「输出中」"},{pass:true,t:path==="gate"?"旁路与对话面同级":"本入口无空气泡"}];
    $("checklist").innerHTML=items.map(function(it){return '<li class="'+(it.pass?"pass":"fail")+'"><span class="dot"></span><span>'+it.t+'</span></li>'}).join("")
  }
  function typeMessage(){
    if(typeTimer)clearInterval(typeTimer);var el=$("streamText");if(!el)return;var i=0;el.textContent="";
    typeTimer=setInterval(function(){i+=3;if(i>=fullMessage.length){el.textContent=fullMessage;clearInterval(typeTimer);typeTimer=null;var s=$("statusOut");if(s)s.remove();return}el.textContent=fullMessage.slice(0,i)},24)
  }
  function render(){
    if(mode==="before"){
      $("agentCol").innerHTML='<div class="bubble empty-air"></div><div class="time">刚刚</div>';
      $("sideTitle").textContent="修复前 · 空气泡";$("sideDesc").textContent="turn_begin 空气泡：头像+时间，内容区空白。";
    }else{
      var html="";
      if(stage===0)html='<div class="bubble gen">'+dots()+'<span>思考中…</span></div><div class="time">刚刚</div>';
      else if(stage===1)html='<div class="status-label">思考中…</div>'+thought()+'<div class="time">刚刚</div>';
      else html='<div class="status-label streaming" id="statusOut">输出中</div>'+thought()+'<div class="bubble"><div id="streamText"></div></div><div class="time">刚刚</div>';
      $("agentCol").innerHTML=html;if(stage===2)typeMessage();
      $("sideTitle").textContent="修复后 · "+({clarify:"澄清",review:"复审",gate:"旁路"}[path]);
      $("sideDesc").textContent=["气泡内「思考中…」+跳动点","thought 默认展开，不被正文顶掉","「输出中」--grad-logo shimmer；完成后消失"][stage];
    }
    checklist();
  }
  function setMode(m){mode=m;$("btnBefore").classList.toggle("active",m==="before");$("btnAfter").classList.toggle("active",m==="after");render()}
  function setStage(s){stage=s;document.querySelectorAll(".stages button[data-stage]").forEach(function(b){b.classList.toggle("active",Number(b.getAttribute("data-stage"))===s)});render()}
  $("btnBefore").onclick=function(){stopPlay();setMode("before")};
  $("btnAfter").onclick=function(){stopPlay();setMode("after")};
  document.querySelectorAll(".stages button[data-stage]").forEach(function(btn){btn.onclick=function(){stopPlay();if(mode==="before")setMode("after");setStage(Number(btn.getAttribute("data-stage")))}});
  document.querySelectorAll("#pathSeg button").forEach(function(btn){btn.onclick=function(){path=btn.getAttribute("data-path");document.querySelectorAll("#pathSeg button").forEach(function(b){b.classList.toggle("active",b===btn)});render()}});
  $("playBtn").onclick=function(){stopPlay();setMode("after");setStage(0);$("playBtn").disabled=true;$("playBtn").textContent="播放中…";var s=0;playTimer=setInterval(function(){s+=1;if(s>2){stopPlay();return}setStage(s)},1600)};
  render();
})();
</script>
</body>
</html>
