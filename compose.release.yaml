# Clean-Linux release stack. Image references are intentionally required:
# public repositories, licenses, versions, and digests remain owner-approved
# release inputs. Use immutable digest references.
services:
  gateway:
    image: ${SANDBOX_GATEWAY_IMAGE:?set SANDBOX_GATEWAY_IMAGE to an immutable published image reference}
    network_mode: host
    environment:
      SBGW_LISTEN: ":${APPROVING_GATEWAY_PORT:-8899}"
      SBGW_DB_PATH: /data/gateway.db
      SBGW_DRIVER: docker
      SBGW_IMAGE: ${SANDBOX_IMAGE:?set SANDBOX_IMAGE to an immutable published sandbox image reference}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8899/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  approving:
    image: ${APPROVING_IMAGE:?set APPROVING_IMAGE to an immutable published image reference}
    network_mode: host
    environment:
      APPROVING_PORT: ${APPROVING_PORT:-8080}
      APPROVING_DB: /data/approving.db
      APPROVING_SANDBOX_GATEWAY_URL: http://127.0.0.1:${APPROVING_GATEWAY_PORT:-8899}
      APPROVING_SANDBOX_IMAGE: ${SANDBOX_IMAGE}
      # Generated by release-smoke.sh; protects the loopback-only doctor
      # control plane and is never an end-user credential.
      APPROVING_DOCTOR_TOKEN: ${APPROVING_DOCTOR_TOKEN:?set APPROVING_DOCTOR_TOKEN to a random smoke-session token}
      # Demo mode is local-host only. Non-local deployments must supply their
      # own auth users and gateway credentials; see server/CONFIGURATION.md.
      APPROVING_DEPLOYMENT_MODE: ${APPROVING_DEPLOYMENT_MODE:-local-demo}
    volumes:
      - approving-data:/data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/approving",
          "doctor",
          "--api-url",
          "http://127.0.0.1:8080",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

volumes:
  approving-data:
  gateway-data:
