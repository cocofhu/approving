# Published-image stack (GHCR). Used by ./start.sh by default and by
# ./release-smoke.sh (smoke requires immutable @sha256 refs via env).
services:
  gateway:
    image: ${SANDBOX_GATEWAY_IMAGE:-ghcr.io/cocofhu/sandbox-gateway:0.2.1-beta}
    network_mode: host
    environment:
      SBGW_LISTEN: ":${APPROVING_GATEWAY_PORT:-8899}"
      SBGW_DB_PATH: /data/gateway.db
      SBGW_DRIVER: docker
      # Per-provider template; SBGW_IMAGE is cursor-only fallback when template/map miss.
      SBGW_IMAGE_TEMPLATE: ${SBGW_IMAGE_TEMPLATE:-ghcr.io/cocofhu/universal-sandbox-{provider}:0.2.1-beta}
      SBGW_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/cocofhu/universal-sandbox-cursor:0.2.1-beta}
      # Require Bearer auth on /api/v1/* (healthz stays open).
      SBGW_API_KEYS: ${SANDBOX_GATEWAY_API_KEY:-approving-local-demo}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.localdata/gateway:/data
    # Image is debian-slim + binary only (no wget/curl). Probe TCP listen.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${APPROVING_GATEWAY_PORT:-8899}'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  approving:
    image: ${APPROVING_IMAGE:-ghcr.io/cocofhu/approving:0.2.1-beta}
    network_mode: host
    environment:
      APPROVING_PORT: ${APPROVING_PORT:-8080}
      APPROVING_DB: /data/approving.db
      APPROVING_SANDBOX_GATEWAY_URL: http://127.0.0.1:${APPROVING_GATEWAY_PORT:-8899}
      APPROVING_SANDBOX_GATEWAY_API_KEY: ${SANDBOX_GATEWAY_API_KEY:-approving-local-demo}
      # Global force only when explicitly set (smoke / optional). Empty = per-backend below.
      APPROVING_SANDBOX_IMAGE: ${APPROVING_SANDBOX_IMAGE:-}
      APPROVING_SANDBOX_IMAGE_CURSOR: ${APPROVING_SANDBOX_IMAGE_CURSOR:-ghcr.io/cocofhu/universal-sandbox-cursor:0.2.1-beta}
      APPROVING_SANDBOX_IMAGE_CLAUDE_CODE: ${APPROVING_SANDBOX_IMAGE_CLAUDE_CODE:-ghcr.io/cocofhu/universal-sandbox-claude_code:0.2.1-beta}
      APPROVING_SANDBOX_IMAGE_CODEBUDDY: ${APPROVING_SANDBOX_IMAGE_CODEBUDDY:-ghcr.io/cocofhu/universal-sandbox-codebuddy:0.2.1-beta}
      APPROVING_SANDBOX_IMAGE_TRAE: ${APPROVING_SANDBOX_IMAGE_TRAE:-ghcr.io/cocofhu/universal-sandbox-trae:0.2.1-beta}
      # Generated by start.sh / release-smoke.sh when unset.
      APPROVING_DOCTOR_TOKEN: ${APPROVING_DOCTOR_TOKEN:-}
      APPROVING_DEPLOYMENT_MODE: ${APPROVING_DEPLOYMENT_MODE:-local-demo}
      APPROVING_AUTH_USERS: ${APPROVING_AUTH_USERS:-}
    volumes:
      - ./.localdata/db:/data
      # Agent profiles / org / platform-rules (WORKDIR-relative data/*). Keep separate from SQLite /data.
      - ./.localdata/app-data:/app/data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/approving",
          "doctor",
          "--api-url",
          "http://127.0.0.1:${APPROVING_PORT:-8080}",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped
