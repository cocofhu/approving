# Published-image stack (GHCR). Used by ./start.sh by default and by
# ./release-smoke.sh (smoke requires immutable @sha256 refs via env).
services:
  gateway:
    image: ${SANDBOX_GATEWAY_IMAGE:-ghcr.io/cocofhu/sandbox-gateway:0.0.2-beta}
    network_mode: host
    environment:
      SBGW_LISTEN: ":${APPROVING_GATEWAY_PORT:-8899}"
      SBGW_DB_PATH: /data/gateway.db
      SBGW_DRIVER: docker
      SBGW_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/cocofhu/universal-sandbox-cursor:0.0.2-beta}
      # Require Bearer auth on /api/v1/* (healthz stays open).
      SBGW_API_KEYS: ${SANDBOX_GATEWAY_API_KEY:-approving-local-demo}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data
    # Image is debian-slim + binary only (no wget/curl). Probe TCP listen.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${APPROVING_GATEWAY_PORT:-8899}'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  approving:
    image: ${APPROVING_IMAGE:-ghcr.io/cocofhu/approving:0.0.2-beta}
    network_mode: host
    environment:
      APPROVING_PORT: ${APPROVING_PORT:-8080}
      APPROVING_DB: /data/approving.db
      APPROVING_SANDBOX_GATEWAY_URL: http://127.0.0.1:${APPROVING_GATEWAY_PORT:-8899}
      APPROVING_SANDBOX_GATEWAY_API_KEY: ${SANDBOX_GATEWAY_API_KEY:-approving-local-demo}
      APPROVING_SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/cocofhu/universal-sandbox-cursor:0.0.2-beta}
      # Generated by start.sh / release-smoke.sh when unset.
      APPROVING_DOCTOR_TOKEN: ${APPROVING_DOCTOR_TOKEN:-}
      APPROVING_DEPLOYMENT_MODE: ${APPROVING_DEPLOYMENT_MODE:-local-demo}
      APPROVING_AUTH_USERS: ${APPROVING_AUTH_USERS:-}
    volumes:
      - approving-data:/data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/approving",
          "doctor",
          "--api-url",
          "http://127.0.0.1:${APPROVING_PORT:-8080}",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

volumes:
  approving-data:
  gateway-data:
