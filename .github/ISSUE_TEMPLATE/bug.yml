name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Observed behavior and impact
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      value: |
        - Approving version or commit:
        - Deployment type:
        - Browser/OS:
        - sandbox-gateway version:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs or screenshots with credentials and private data removed
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
