name: publish-sandbox

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated AGENT_PROVIDER values"
        required: false
        default: "cursor,claude_code,codebuddy,trae"

permissions:
  contents: read
  packages: write

jobs:
  providers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.set.outputs.list }}
    steps:
      - id: set
        run: |
          raw="${{ github.event.inputs.providers || 'cursor,claude_code,codebuddy,trae' }}"
          # JSON array for matrix
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ["RAW"]
          items = [x.strip() for x in raw.split(",") if x.strip()]
          print("list=" + json.dumps(items))
          PY
        env:
          RAW: ${{ github.event.inputs.providers || 'cursor,claude_code,codebuddy,trae' }}

  publish:
    needs: providers
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.providers.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cocofhu/universal-sandbox-${{ matrix.provider }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: ./sandbox-gateway/sandbox
          file: ./sandbox-gateway/sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGENT_PROVIDER=${{ matrix.provider }}
            BASE_IMAGE=ubuntu:22.04
