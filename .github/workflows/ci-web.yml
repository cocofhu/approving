name: ci-web

on:
  push:
    paths: ["web/**", ".github/workflows/ci-web.yml", ".github/scripts/coverage-badge-color.sh", ".github/scripts/publish-coverage-badge.sh"]
  pull_request:
    paths: ["web/**", ".github/workflows/ci-web.yml", ".github/scripts/coverage-badge-color.sh", ".github/scripts/publish-coverage-badge.sh"]

jobs:
  web:
    runs-on: ubuntu-latest
    # contents:write only used to update the orphan coverage-badges branch endpoint.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx vue-tsc --noEmit
      - run: npm test -- --coverage
      - run: npm run build
      - name: Export web Lines coverage
        id: coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web
        continue-on-error: true
        run: |
          set -euo pipefail
          summary="coverage/coverage-summary.json"
          if [[ ! -f "$summary" ]]; then
            echo "missing $summary; skip badge publish"
            exit 1
          fi
          pct="$(jq -r '.total.lines.pct' "$summary")"
          if [[ -z "$pct" || "$pct" == "null" ]]; then
            echo "could not parse total.lines.pct; skip badge publish"
            exit 1
          fi
          color="$(../.github/scripts/coverage-badge-color.sh "$pct")"
          echo "pct=$pct" >>"$GITHUB_OUTPUT"
          echo "color=$color" >>"$GITHUB_OUTPUT"
          echo "ok=true" >>"$GITHUB_OUTPUT"
          echo "web Lines coverage=${pct}% color=${color}"
      - name: Publish coverage-web badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.coverage.outputs.ok == 'true'
        continue-on-error: true
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/publish-coverage-badge.sh \
            coverage-web.json \
            coverage-web \
            "${{ steps.coverage.outputs.pct }}" \
            "${{ steps.coverage.outputs.color }}"

  # Critical-path Playwright subset (mock vite.e2e harness; no real backend).
  # Parallel with `web`. Minimal permissions (no coverage-badge write).
  # Follow-up: add this job to main required checks for hard merge blocking.
  web-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical-path e2e
        run: npm run test:e2e:ci
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-failure
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
