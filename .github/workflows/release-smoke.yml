name: release-smoke

# Digest-pinned clean-Linux smoke. Run manually after GHCR images exist;
# do not auto-trigger on tags (beta tags would fail without release secrets).
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require digest-pinned images
        env:
          APPROVING_IMAGE: ${{ secrets.APPROVING_IMAGE }}
          SANDBOX_GATEWAY_IMAGE: ${{ secrets.SANDBOX_GATEWAY_IMAGE }}
          SANDBOX_IMAGE: ${{ secrets.SANDBOX_IMAGE }}
        run: |
          test -n "$APPROVING_IMAGE"
          test -n "$SANDBOX_GATEWAY_IMAGE"
          test -n "$SANDBOX_IMAGE"
          export APPROVING_IMAGE SANDBOX_GATEWAY_IMAGE SANDBOX_IMAGE
          ./release-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
